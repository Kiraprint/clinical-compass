# F3/FR-24: демо VAPID-ключ один на api и reminders-worker, иначе push,
# подписанный воркером, не проверяется браузером (ключи генерируются заново).
x-vapid: &vapid
  CC_VAPID_PRIVATE_KEY: "${CC_VAPID_PRIVATE_KEY:-}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compass}
      POSTGRES_DB: compass
    # NEW-4: БД не публикуется на 0.0.0.0 — доступ только внутри compose-сети.
    # Для локального доступа к тестовой БД: docker compose port postgres 5432
    # или профиль `-f infra/docker-compose.dev.yml` (см. tools/ci.sh).
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d compass"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    # NEW-4: Qdrant доступен только api/kb-seed внутри compose-сети.
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Общий счётчик rate limiter логинов (docs/03 §12, docs/10 R24): перебор
  # пароля/2FA считается на всю инсталляцию, а не на процесс uvicorn.
  # В хост-сеть порт не публикуется (NEW-4): доступ только api внутри compose;
  # без пароля — аутентификация не нужна, т.к. сеть приватная, а ключи
  # лимитера содержат только SHA-256 идентификаторов и живут ≤ 2×CC_RATE_WINDOW.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Без persistence: счётчики — эфемерные окна (TTL ≤ 2×CC_RATE_WINDOW),
    # после рестарта Redis лимит просто начинается заново (fail-open).
    # Потолок памяти: ключи фиксированных окон живут ≤ 2×окна, но массовый
    # перебой может забить хост; allkeys-lru безопасен — вытеснение окна лишь
    # ослабляет лимит для конкретного ключа, а не ломает его.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    # ML-сайдкар живёт только во внутренней mlnet; остальные зависимости —
    # в default. У ml нет egress и нет доступа к postgres/qdrant/redis.
    networks:
      - default
      - mlnet
    environment:
      # F3: секреты читаются из .env (docker compose подхватывает автоматически).
      # Демо-значения — только дефолты, если .env отсутствует. Прод: `tools/gen-secrets.sh`
      # + CC_ALLOW_DEMO_SECRETS=false → приложение падает на демо-секретах (fail-fast).
      CC_DATABASE_URL: postgresql+psycopg://compass:${POSTGRES_PASSWORD:-compass}@postgres:5432/compass
      CC_JWT_SECRET: ${CC_JWT_SECRET:-demo-jwt-secret-0123456789abcdefghij}
      CC_DATA_KEY: ${CC_DATA_KEY:-compass-demo-data-key-do-not-use-in-prod-0123456789}
      CC_ALLOW_DEMO_SECRETS: "${CC_ALLOW_DEMO_SECRETS:-false}"  # NEW-5: по умолчанию fail-fast
      CC_COOKIE_SECURE: "${CC_COOKIE_SECURE:-false}"  # демо HTTP; prod HTTPS → true
      CC_REQUIRE_OTP: "${CC_REQUIRE_OTP:-true}"  # false — вход без TOTP (секрет остаётся в БД); прод — true
      # LLM-роутер раздела БЗ (docs/04 FR-17): пусто → поиск по всем разделам.
      # host.docker.internal:18080 — llama.cpp с tools/llm.sh на хосте.
      # Локальная модель в контуре: docker-compose.local-llm.yml (http://local-llm:8080/v1),
      # docs/17. По умолчанию оверлей не подключён.
      CC_ASSISTANT_LLM_URL: "${CC_ASSISTANT_LLM_URL:-}"
      CC_ASSISTANT_LLM_MODEL: "${CC_ASSISTANT_LLM_MODEL:-local}"
      CC_ASSISTANT_LLM_API_KEY: "${CC_ASSISTANT_LLM_API_KEY:-}"
      CC_ASSISTANT_LLM_TIMEOUT: "${CC_ASSISTANT_LLM_TIMEOUT:-10}"
      # FR-31: анализ переписки (факты-черновики). Требует и LLM URL выше, и флаг;
      # по умолчанию выключен — ПДн переписки в LLM не уходят (docs/10 R23, docs/17).
      CC_CHAT_INSIGHTS_ENABLED: "${CC_CHAT_INSIGHTS_ENABLED:-false}"
      # FR-37: анамнез пациента. Выключен — 503 ANAMNESIS_DISABLED (docs/10 R27).
      CC_ANAMNESIS_ENABLED: "${CC_ANAMNESIS_ENABLED:-false}"
      <<: *vapid
      CC_QDRANT_URL: http://qdrant:6333
      # ML-сайдкар (docs/08 §4): GPU-профиль, http://ml:8080 во внутренней
      # сети. Без профиля gpu сайдкара нет — на не-GPU хосте CC_ML_URL=
      # (api остаётся на hash/regex).
      CC_ML_URL: "${CC_ML_URL:-http://ml:8080}"
      CC_ML_TOKEN: "${CC_ML_TOKEN:-}"
      CC_ML_TIMEOUT: "${CC_ML_TIMEOUT:-5}"
      # Бэкенд деперсонализации LLM-egress (docs/12): off | regex | natasha |
      # rubert | hybrid | remote. remote требует доступного сайдкара (CC_ML_URL).
      CC_DEPERSONALIZE_NER: "${CC_DEPERSONALIZE_NER:-off}"
      # Поиск (docs/08 §3-4): профиль эмбеддера и геометрия коллекции.
      # Профиль и коллекцию меняют ОДНОВРЕМЕННО и только после переиндекса
      # (kb_seed --reset + tools/rechunk_collection.py), иначе размерность
      # dense не совпадёт и api не стартует (IndexConfigError).
      CC_EMBEDDER: "${CC_EMBEDDER:-hash}"
      CC_QDRANT_COLLECTION: "${CC_QDRANT_COLLECTION:-kb}"
      CC_KB_CHUNK_CHARS: "${CC_KB_CHUNK_CHARS:-1800}"
      CC_KB_CHUNK_OVERLAP: "${CC_KB_CHUNK_OVERLAP:-120}"
      # Rate limiter логинов (docs/03 §12): общий бэкенд для всех воркеров и
      # реплик api. Пусто → memory (бюджет на процесс); auto при живом Redis.
      CC_REDIS_URL: "${CC_REDIS_URL:-redis://redis:6379/0}"
      CC_RATE_BACKEND: "${CC_RATE_BACKEND:-auto}"
      # FR-25: ЕМИАС. Egress по умолчанию ВЫКЛЮЧЕН (docs/10 R17); включается
      # CC_EMIAS_ENABLED=true. CC_EMIAS_ALLOW_INSECURE=true — только для мока по http.
      CC_EMIAS_ENABLED: "${CC_EMIAS_ENABLED:-false}"
      CC_EMIAS_BASE_URL: "${CC_EMIAS_BASE_URL:-http://emias-mock:8090}"
      CC_EMIAS_CLIENT_ID: "${CC_EMIAS_CLIENT_ID:-compass}"
      CC_EMIAS_CLIENT_SECRET: "${CC_EMIAS_CLIENT_SECRET:-compass-secret}"
      CC_EMIAS_ALLOW_INSECURE: "${CC_EMIAS_ALLOW_INSECURE:-false}"
    # LLM-роутер раздела БЗ (docs/04 FR-17): хост с tools/llm.sh доступен из контейнера.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      # service_started, не service_healthy: недоступный Redis — деградация
      # в memory (WARNING), а не отказ старта api.
      redis:
        condition: service_started
    # F12: порт 8000 не экспонируется на хост — только через nginx (ui:8090).
    # Прямой HTTP-доступ в обход TLS/nginx отсутствует.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  kb-seed:
    build:
      context: ..
      dockerfile: api/Dockerfile
    # Без --reset: upsert идемпотентен по text_hash (docs/15 §11), а --reset
    # каждый рестарт стирал бы коллекцию вместе с чанками обогащения.
    command: ["/app/.venv/bin/python", "-m", "app.kb_seed"]
    environment:
      CC_QDRANT_URL: http://qdrant:6333
      CC_DATABASE_URL: postgresql+psycopg://compass:${POSTGRES_PASSWORD:-compass}@postgres:5432/compass
      CC_ALLOW_DEMO_SECRETS: "${CC_ALLOW_DEMO_SECRETS:-false}"  # NEW-5: по умолчанию fail-fast
      CC_DATA_KEY: ${CC_DATA_KEY:-compass-demo-data-key-do-not-use-in-prod-0123456789}
      # Сид обязан совпадать с api по эмбеддеру, коллекции и нарезке (docs/08 §3):
      # иначе чанки пишутся в чужую геометрию или чужой размерностью.
      CC_EMBEDDER: "${CC_EMBEDDER:-hash}"
      CC_QDRANT_COLLECTION: "${CC_QDRANT_COLLECTION:-kb}"
      CC_KB_CHUNK_CHARS: "${CC_KB_CHUNK_CHARS:-1800}"
      CC_KB_CHUNK_OVERLAP: "${CC_KB_CHUNK_OVERLAP:-120}"
      CC_ML_URL: "${CC_ML_URL:-http://ml:8080}"
      CC_ML_TOKEN: "${CC_ML_TOKEN:-}"
      CC_ML_TIMEOUT: "${CC_ML_TIMEOUT:-5}"
    # С remote-профилем сид эмбеддит через ML-сайдкар: он виден только из mlnet,
    # поэтому одной default-сети недостаточно (остаётся для postgres/qdrant).
    networks:
      - default
      - mlnet
    depends_on:
      qdrant:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: "no"
  # Обогащение КБ (docs/15): отдельный процесс с исходящим трафиком в PubMed/ВОЗ.
  # Пишет в те же Postgres/Qdrant, что и API, но не обслуживает запросы пациентов.
  kb-enrichment:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "app.enrichment", "serve"]
    environment:
      CC_DATABASE_URL: postgresql+psycopg://compass:${POSTGRES_PASSWORD:-compass}@postgres:5432/compass
      CC_QDRANT_URL: http://qdrant:6333
      CC_ALLOW_DEMO_SECRETS: "${CC_ALLOW_DEMO_SECRETS:-false}"
      CC_DATA_KEY: ${CC_DATA_KEY:-compass-demo-data-key-do-not-use-in-prod-0123456789}
      # PubMed: без ключа 3 req/s; email желателен (правила NCBI).
      CC_ENRICH_PUBMED_EMAIL: "${CC_ENRICH_PUBMED_EMAIL:-}"
      CC_ENRICH_PUBMED_API_KEY: "${CC_ENRICH_PUBMED_API_KEY:-}"
      CC_ENRICH_PUBMED_DAYS: "${CC_ENRICH_PUBMED_DAYS:-30}"
      CC_ENRICH_INTERVAL_HOURS: "${CC_ENRICH_INTERVAL_HOURS:-24}"
      CC_ENRICH_OFFLINE: "${CC_ENRICH_OFFLINE:-false}"
      # Индексация работ идёт тем же эмбеддером/коллекцией, что у api (docs/08 §3-4).
      CC_EMBEDDER: "${CC_EMBEDDER:-hash}"
      CC_QDRANT_COLLECTION: "${CC_QDRANT_COLLECTION:-kb}"
      CC_ML_URL: "${CC_ML_URL:-http://ml:8080}"
      CC_ML_TOKEN: "${CC_ML_TOKEN:-}"
      CC_ML_TIMEOUT: "${CC_ML_TIMEOUT:-5}"
      # Нарезка обогащения обязана совпадать с нарезкой сида и api (docs/08 §4).
      CC_ENRICH_CHUNK_CHARS: "${CC_KB_CHUNK_CHARS:-1800}"
      CC_ENRICH_CHUNK_OVERLAP: "${CC_KB_CHUNK_OVERLAP:-120}"
    networks:
      - default
      - mlnet
    depends_on:
      # api прогоняет alembic upgrade head в lifespan — ждём схему, а не гоняем
      # миграции из двух процессов одновременно.
      api:
        condition: service_healthy
      kb-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # FR-24: доставка напоминаний врача. Отдельный процесс (как kb-enrichment):
  # в MVP нет Celery/APScheduler. Период тика — CC_REMINDER_TICK_SECONDS.
  reminders-worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "app.reminders_worker"]
    environment:
      CC_DATABASE_URL: postgresql+psycopg://compass:${POSTGRES_PASSWORD:-compass}@postgres:5432/compass
      CC_ALLOW_DEMO_SECRETS: "${CC_ALLOW_DEMO_SECRETS:-false}"
      CC_DATA_KEY: ${CC_DATA_KEY:-compass-demo-data-key-do-not-use-in-prod-0123456789}
      CC_PUSH_ENABLED: "${CC_PUSH_ENABLED:-true}"
      <<: *vapid
      CC_REMINDER_TICK_SECONDS: "${CC_REMINDER_TICK_SECONDS:-60}"
    depends_on:
      # Схему создаёт api (alembic upgrade head в lifespan) — воркер ждёт health.
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: ui/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      kb-seed:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "8090:80"

  seed:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "app.seed", "--reset", "--patients", "12", "--days", "14"]
    environment:
      CC_DATABASE_URL: postgresql+psycopg://compass:${POSTGRES_PASSWORD:-compass}@postgres:5432/compass
      CC_DEMO_TOTP: JBSWY3DPEHPK3PXP
      CC_ALLOW_DEMO_SECRETS: "${CC_ALLOW_DEMO_SECRETS:-false}"  # NEW-5: по умолчанию fail-fast
      CC_DATA_KEY: ${CC_DATA_KEY:-compass-demo-data-key-do-not-use-in-prod-0123456789}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  # FR-25: мок ЕМИАС (REST+FHIR-гибрид, см. api/app/emias/mock.py). В обычный
  # `up` не входит — только профиль emias:
  #   docker compose -f infra/docker-compose.yml --profile emias up -d emias-mock
  # Данные — детерминированные вымышленные фикстуры; ПДн нет.
  emias-mock:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["/app/.venv/bin/uvicorn", "app.emias.mock:app", "--host", "0.0.0.0", "--port", "8090"]
    profiles: ["emias"]
    environment:
      CC_EMIAS_CLIENT_ID: "${CC_EMIAS_CLIENT_ID:-compass}"
      CC_EMIAS_CLIENT_SECRET: "${CC_EMIAS_CLIENT_SECRET:-compass-secret}"
      CC_EMIAS_MOCK_LATENCY_MS: "${CC_EMIAS_MOCK_LATENCY_MS:-0}"
      CC_EMIAS_MOCK_TIMEOUT_S: "${CC_EMIAS_MOCK_TIMEOUT_S:-2}"
      CC_EMIAS_MOCK_RATE_LIMIT: "${CC_EMIAS_MOCK_RATE_LIMIT:-60}"
    expose:
      - "8090"
    restart: unless-stopped

  # ML-сайдкар (docs/08 §4): эмбеддинги / реранк / маскирование ПДн на GPU.
  # Профиль gpu: без него стек стартует как раньше (CI/e2e без видеокарты),
  # api при этом остаётся на CC_EMBEDDER=hash и CC_DEPERSONALIZE_NER=off.
  # Сеть mlnet внутренняя: у ml нет egress и он не видит postgres/qdrant/redis.
  # Веса качает одноразовый ml-warmup (единственный с egress), затем ml
  # работает офлайн (HF_HUB_OFFLINE=1). Порт на хост не публикуется.
  ml:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: ml/Dockerfile
    image: clinical-compass-ml:local
    restart: unless-stopped
    environment:
      CC_ML_DEVICE: "${CC_ML_DEVICE:-cuda}"
      CC_ML_DEFAULT_PROFILE: "${CC_ML_DEFAULT_PROFILE:-qwen3-0.6b}"
      CC_ML_PROFILES: "${CC_ML_PROFILES:-}"
      CC_ML_TOKEN: "${CC_ML_TOKEN:-}"
      CC_ML_RERANK_MODEL: "${CC_ML_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"
      CC_ML_NER_MODEL: "${CC_ML_NER_MODEL:-redmadrobot-rnd/rubert-base-pii-ner}"
      CC_ML_ALLOW_ANONYMOUS: "${CC_ML_ALLOW_ANONYMOUS:-0}"
      HF_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
    volumes:
      - ml-models:/models
    networks:
      - mlnet
    expose:
      - "8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)); sys.exit(0 if d.get('status')=='ready' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 10m
      retries: 3

  # Одноразовый прогрев весов: единственный контейнер с egress к Hugging Face.
  # Запуск: docker compose --profile gpu run --rm ml-warmup
  ml-warmup:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: ml/Dockerfile
    image: clinical-compass-ml:local
    command: ["python", "-m", "warmup"]
    restart: "no"
    environment:
      HF_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
      # Единственный контейнер, которому разрешён egress к Hugging Face.
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      CC_ML_DEFAULT_PROFILE: "${CC_ML_DEFAULT_PROFILE:-qwen3-0.6b}"
      CC_ML_PROFILES: "${CC_ML_PROFILES:-}"
      CC_ML_RERANK_MODEL: "${CC_ML_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"
      CC_ML_NER_MODEL: "${CC_ML_NER_MODEL:-redmadrobot-rnd/rubert-base-pii-ner}"
    volumes:
      - ml-models:/models

volumes:
  pgdata:
  qdrant-data:
  ml-models:

networks:
  # api<->ml без egress и без доступа к БД/очередям: там ходит сырой текст.
  mlnet:
    internal: true