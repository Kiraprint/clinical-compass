name: Android APK

# Сборка универсального APK (Capacitor + FCM) из веб-клиента (item 4).
# Требуемые secrets/vars (GitHub):
#   - secrets.FCM_GOOGLE_SERVICES_JSON — содержимое google-services.json (Firebase-проект);
#     без него APK собирается, но FCM-пуши не работают.
#   - vars.VITE_API_BASE — публичный HTTPS-URL API для нативной сборки (напр. демо-туннель).
#   - (release на v* тегах) keystore-подпись: secrets.ANDROID_KEYSTORE_B64,
#     ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#     Без них билдится подписанный debug-APK.
#
# Куда попадает результат:
#   - ветки main/master, ручной запуск → artifact `compass-apk`;
#   - тег v* (ручной прогон на теге) → APK прикрепляется к существующему Release.
#
# Основной путь релиза теперь локальный: `tools/release-local.sh X.Y.Z` гоняет
# тесты и сборку на нашей стороне, создаёт тег и GitHub Release и заливает туда
# готовый APK (`gh release upload`). GitHub Actions остаются резервным путём:
# лимиты GH исчерпаны, поэтому они не запускаются автоматически на теги —
# workflow release.yml с публикацией образов удалён, образы собираются локально.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Capacitor + FCM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Android Gradle requires 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Resolve version (tag vX.Y.Z → versionCode X*10000+Y*100+Z)
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == v* ]]; then
            name="${ref#v}"
            IFS=. read -r major minor patch <<< "$name"
            code=$(( 10#${major:-0} * 10000 + 10#${minor:-0} * 100 + 10#${patch:-0} ))
            echo "label=$name" >> "$GITHUB_OUTPUT"
          else
            name="1.0-${GITHUB_SHA::7}"
            code=$(( 1000 + GITHUB_RUN_NUMBER ))
            echo "label=$name" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName=$name versionCode=$code"

      - name: Build web SPA (VITE_API_BASE → нативная сборка)
        working-directory: ui
        run: |
          npm ci
          VITE_API_BASE="${{ vars.VITE_API_BASE }}" npm run build

      - name: Cache Capacitor android platform
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: mobile-npm-${{ hashFiles('mobile/package-lock.json') }}

      - name: npm ci + cap sync android
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Inject google-services.json (Firebase)
        shell: bash
        run: |
          if [ -n "${{ secrets.FCM_GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.FCM_GOOGLE_SERVICES_JSON }}" > mobile/android/app/google-services.json
            echo "google-services.json injected for FCM"
          else
            echo "::warning::FCM_GOOGLE_SERVICES_JSON не задан — APK соберётся, но пуши не будут доставлены"
          fi

      - name: Configure signing (release on v* tags)
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > mobile/android/app/release.keystore
            echo "storeFile=app/release.keystore" > mobile/android/keystore.properties
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> mobile/android/keystore.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> mobile/android/keystore.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> mobile/android/keystore.properties
            echo "release=yes" >> "$GITHUB_OUTPUT"
          else
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_B64 не задан — APK будет debug-подписи"
          fi

      - name: Build APK (debug by default, release when signed)
        working-directory: mobile/android
        env:
          SIGNING_RELEASE: ${{ steps.signing.outputs.release }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          chmod +x gradlew
          if [ "$SIGNING_RELEASE" = "yes" ]; then
            ./gradlew assembleRelease -PccVersionCode="$VERSION_CODE" -PccVersionName="$VERSION_NAME"
          else
            ./gradlew assembleDebug -PccVersionCode="$VERSION_CODE" -PccVersionName="$VERSION_NAME"
          fi

      - name: Name APK by version
        shell: bash
        env:
          VERSION_LABEL: ${{ steps.ver.outputs.label }}
          SIGNING_RELEASE: ${{ steps.signing.outputs.release }}
        run: |
          mkdir -p dist
          if [ "$SIGNING_RELEASE" = "yes" ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk \
               "dist/compass-${VERSION_LABEL}-release.apk"
          else
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
               "dist/compass-${VERSION_LABEL}-debug.apk"
          fi
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: compass-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          append_body: true
          body: |

            ### Android APK
            `versionName`: ${{ steps.ver.outputs.name }}, release keystore (CI).
            Для доставки пушей в google-services.json должен быть Firebase-проект.
