name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Tests + build (core, api, docker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create test database
        env:
          PGPASSWORD: compass
        run: |
          psql -h 127.0.0.1 -U compass -d compass -c "CREATE DATABASE compass_test"

      # F8: uv sync --frozen — воспроизводимая установка строго из uv.lock
      # (pip install -e игнорировал lockfile и мог подтянуть другие версии).
      - name: Install deps (uv sync --frozen)
        run: uv sync --frozen --all-packages

      # F8: аудит зависимостей на известные CVE (ГОСТ Р 56939).
      - name: Dependency audit (pip-audit)
        run: uv run pip-audit --skip-editable || true  # отчёт без падения на транзитивных CVE

      - name: Pytest — core (coverage ≥ 95%)
        run: uv run pytest core/tests --cov=compass --cov-fail-under=95 -q

      - name: Pytest — api (real Postgres, alembic upgrade head)
        run: uv run pytest api/tests -q
        env:
          CC_TEST_DATABASE_URL: postgresql+psycopg://compass:compass@127.0.0.1:5432/compass_test
          CC_QDRANT_URL: http://127.0.0.1:6333

      - name: Build docker images (api + ui)
        run: docker compose -f infra/docker-compose.yml build api ui

      - name: docker-compose config sanity
        run: docker compose -f infra/docker-compose.yml config -q

  e2e:
    name: e2e (Playwright, full compose stack)
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        # --profile seed: сид и индексатор КБ — one-shot сервисы в отдельном
        # профиле, обычный `up` их больше не перезапускает (docs/03 §13).
        run: docker compose -f infra/docker-compose.yml --profile seed up -d --build
        env:
          # CI крутит только demo-данные и не имеет infra/.env — разрешаем
          # демо-секреты явно, иначе api падает на fail-fast (NEW-5/F3).
          CC_ALLOW_DEMO_SECRETS: "true"
          CC_COOKIE_SECURE: "false"
      - name: Wait for UI
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8090/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8090/ >/dev/null
      # UI-health наступает раньше, чем one-shot kb-seed создаст коллекцию:
      # вопрос ассистента в первые секунды получил бы пустую базу.
      - name: Wait for KB indexer
        run: |
          state=""
          for i in $(seq 1 120); do
            id="$(docker compose -f infra/docker-compose.yml --profile seed ps -aq kb-seed)"
            if [ -n "$id" ]; then
              state="$(docker inspect -f '{{.State.Status}}/{{.State.ExitCode}}' "$id")"
              [ "$state" = "exited/0" ] && break
            fi
            sleep 1
          done
          test "$state" = "exited/0"

      - name: Setup Node + Playwright
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright + chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: e2e
        run: npx playwright test
        env:
          CC_E2E_URL: http://127.0.0.1:8090