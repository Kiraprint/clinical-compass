# F12: access_log без URI — patient UUID не попадает в логи nginx.
# log_format должен быть в http-контексте (этот файл инклудится в http{}).
log_format safe '$remote_addr $request_method $status $body_bytes_sent';

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log safe;

  # Docker DNS (127.0.0.11) — пере-резолв api при рекреации контейнера
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health {
    proxy_pass $api_upstream;
  }
  location / {
    try_files $uri /index.html;
  }
}