# F12: access_log без URI — patient UUID не попадает в логи nginx.
# log_format должен быть в http-контексте (этот файл инклудится в http{}).
log_format safe '$remote_addr $request_method $status $body_bytes_sent';

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log safe;

  # Docker DNS (127.0.0.11) — пере-резолв api при рекреации контейнера
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
    # Аудиозапись приёма идёт через этот же прокси: дефолтный лимит nginx (1m)
    # отбивал 413 любую запись длиннее ~минуты (webm 128 кбит/с ≈ 19 МБ на 20 минут).
    # Потолок привязан к CC_SESSION_AUDIO_MAX_MB (200) + запас на multipart-
    # обвязку: nginx считает всё тело запроса, а не только файл. Поднимаешь
    # лимит в .env — подними и здесь (это проверяет тест в api/tests).
    client_max_body_size 210m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (docs/03 §1.3): поток токенов ассистента должен идти клиенту сразу.
    # С буферизацией по умолчанию nginx копит всё тело и отдаёт его в конце —
    # UI всё это время висит на «Думаю…», а по таймауту шлюза получает обрыв.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    # Долгий ответ модели не должен обрываться прокси раньше клиента.
    proxy_read_timeout 300s;
  }
  # Базовая защита статики: без nosniff браузер может «угадать» тип favicon/PNG
  # и исполнить содержимое как HTML. CSP для SPA — 'self' + inline-стили,
  # внешних скриптов и CDN в сборке нет.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

  location /health {
    proxy_pass $api_upstream;
  }
  # Иконки: фиксируем тип явно — при nosniff браузер не должен угадывать.
  location ~* \.svg$ {
    default_type image/svg+xml;
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;
  }
}
