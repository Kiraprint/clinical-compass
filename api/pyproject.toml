[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-compass-api"
version = "0.1.0"
description = "FastAPI-сервис: auth/RBAC, consent, аудит, скрининг, чек-ины, дашборд врача."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pywebpush>=2.0",
    "psycopg[binary]>=3.2",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "qdrant-client>=1.10",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "clinical-compass-core>=0.1",
    "greenlet>=3",
    # docs/18 §4.6: AES-256-GCM + HKDF для шифрованных артефактов сессий.
    "cryptography>=42",
    # docs/18 §7 (FR-40): ГОСТ Р 34.10-2012 / 34.11-2012 (Стрибог), detached CMS
    # SignedData на asn1crypto и печатная форма протокола HTML/CSS → PDF
    # (WeasyPrint; кириллица берётся из fontconfig).
    "gostcrypto>=1.2.5",
    "asn1crypto>=1.5.1",
    "weasyprint>=62",
    # docs/18 §4.3: multipart-загрузка аудио сессии (разбор частей в сервисе).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Общий счётчик неудачных логинов в Redis (docs/03 §12): без extra модуль
# app.ratelimit работает на памяти процесса (graceful degradation, WARNING).
redis = ["redis>=5"]
# NER-детекция ФИО для деперсонализации (docs/12): ставится отдельно,
# включается CC_DEPERSONALIZE_NER=true; без него — regex/deny-list.
###############################################################
# NER-детекция ФИО (docs/12): ОПЦИОНАЛЬНО.
# natasha тянет pymorphy2 (старый, сломан на py>=3.11) как import-time модуль —
# наш адаптер никогда не конструирует MorphVocab (try/except, деградация),
# инференс полностью оффлайн (модели в wheel), см. тест no_network_egress.
ner = ["natasha>=1.1"]
# rubert-base-pii-ner (Apache-2.0): FIO F1 0.933 на redmadrobot-rnd/pii_benchmark
# (bench/ner), в 5.5x точнее natasha; тяжёлые ML-зависимости — только этот extra.
ner-rubert = ["torch>=2.2", "transformers>=4.40"]
# Продуктивный эмбеддер bge-m3 (CC_EMBEDDER=bge-m3, docs/08 §4): ставится только
# для профиля с нейросетевым поиском. Базовый образ API остаётся без torch.
# Включает FlagEmbedding (тянет torch+transformers). Инференс оффлайн после
# однократного скачивания весов в кэш HF; индекс Qdrant нужно пересобрать.
# sentence-transformers — для dense-профилей qwen3-0.6b / e5-large-instruct /
# user-bge-m3 (SPI Embedder, docs/08 §4); FlagEmbedding — для bge-m3 dense/спarse.
embeddings = ["FlagEmbedding>=1.2", "sentence-transformers>=2.7"]
# Кросс-энкодерный реранк выдачи (CC_RERANKER=<hf-id>, docs/08 §4). Без extra
# реранк деградирует к порядку RRF с предупреждением в лог.
rerank = ["sentence-transformers>=2.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
