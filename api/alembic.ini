# Alembic конфигурация для Clinical Compass API.
# Хост используется локально и внутри контейнера (workspace /app/api).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url резолвится в env.py, приоритет:
#   явный URL, заданный init_db() через command.upgrade -> CC_DATABASE_URL -> app.config.settings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
